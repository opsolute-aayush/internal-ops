name: Build and push Docker image

# Manual only — you pick the version when you run it (Actions tab → this
# workflow → Run workflow). Nothing pushes on its own.
#
# Versioning: x.y.z
#   x = major change / new feature
#   y = UI change, placement, or fix
#   z = bug fix
#
# Pushes aayushop/internal-ops:<version> AND aayushop/internal-ops:latest — the
# VM's Watchtower polls whatever tag docker-compose.prod.yml is pinned to
# (DOCKER_TAG, default "latest"), so pushing :latest is what makes it
# auto-update. Refuses to overwrite a version that's already published, and
# deletes every other version tag from Docker Hub afterward so old images
# don't pile up (git history is the record of what changed, not Docker Hub).
#
# This is also the ONLY place docs/CHANGELOG.md and package.json's version
# get bumped — never do it by hand in a regular commit. That keeps the
# changelog's version and package.json's version from ever drifting apart:
# one always matches whatever was actually published to Docker Hub.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, x.y.z (e.g. 1.4.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be x.y.z (got '${{ inputs.version }}')"
            exit 1
          fi

      # Local file edits only (package.json/package-lock.json) — no network,
      # nothing committed yet. Committed for real in "Commit release" below,
      # only once the image has actually been built and pushed.
      - name: Bump package.json version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      # Auto-generated from the commit log since the last vX.Y.Z tag — a
      # plain record of what shipped, not hand-curated prose. Written to
      # disk now; committed alongside the version bump in "Commit release".
      # (Logic lives in scripts/update-changelog.py, not inlined here — a
      # multi-line Python script inside a YAML block scalar is a
      # significant-whitespace minefield.)
      - name: Update docs/CHANGELOG.md
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty='- %s')
            if [ -z "$LOG" ]; then
              LOG="- No commits since $PREV_TAG."
            fi
          else
            # No vX.Y.Z tag exists yet (this repo's first release under this
            # workflow) — list every commit ever made instead, one line per
            # entry, one very long changelog entry. Bootstrap it once
            # instead: a single note, so history starts clean from here.
            LOG="- Initial tracked release."
          fi
          RELEASE_VERSION="${{ inputs.version }}" RELEASE_LOG="$LOG" python3 scripts/update-changelog.py

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Get Docker Hub API token
        id: hub
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${{ secrets.DOCKERHUB_USERNAME }}\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Docker Hub hub-api login failed — check DOCKERHUB_USERNAME/DOCKERHUB_TOKEN. The version-exists check and old-tag cleanup below both depend on this token."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing version tag
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.hub.outputs.token }}" \
            "https://hub.docker.com/v2/repositories/aayushop/internal-ops/tags/${{ inputs.version }}/")
          if [ "$STATUS" = "200" ]; then
            echo "::error::aayushop/internal-ops:${{ inputs.version }} already exists on Docker Hub — bump the version and re-run."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 -f docker/Dockerfile \
            -t aayushop/internal-ops:${{ inputs.version }} \
            -t aayushop/internal-ops:latest \
            --provenance=false \
            --push .

      - name: Delete older version tags from Docker Hub
        run: |
          TAGS=$(curl -s -H "Authorization: Bearer ${{ steps.hub.outputs.token }}" \
            "https://hub.docker.com/v2/repositories/aayushop/internal-ops/tags/?page_size=100" | jq -r '.results[].name')
          FAILED=0
          for TAG in $TAGS; do
            if [ "$TAG" != "latest" ] && [ "$TAG" != "${{ inputs.version }}" ]; then
              echo "Deleting old tag: $TAG"
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${{ steps.hub.outputs.token }}" \
                "https://hub.docker.com/v2/repositories/aayushop/internal-ops/tags/$TAG/")
              # 202/204 = deleted, 404 = already gone (fine, nothing to clean up).
              if [ "$STATUS" != "202" ] && [ "$STATUS" != "204" ] && [ "$STATUS" != "404" ]; then
                echo "::warning::Failed to delete tag '$TAG' (HTTP $STATUS). It may still be linked on Docker Hub; delete it manually or check DOCKERHUB_TOKEN's Delete scope."
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::warning::One or more old tags could not be deleted. The new release still published fine, this is cleanup-only."
          fi

      # Only reached once the image is actually published — so a failed
      # build/push never leaves behind a version bump or changelog entry
      # for a release that didn't happen.
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docs/CHANGELOG.md
          git commit -m "Release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"
