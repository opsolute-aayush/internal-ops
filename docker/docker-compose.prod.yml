services:
  app:
    container_name: opday-ctf-app
    image: "${DOCKER_IMAGE:-aayushop/opday-ctf}:${DOCKER_TAG:-latest}"
    platform: linux/amd64
    restart: unless-stopped
    environment:
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env — generate with: openssl rand -base64 48}"
      # This is the one deployment path with real TLS (nginx below terminates
      # it), so cookies here should be marked Secure. See lib/auth.ts.
      COOKIE_SECURE: "true"
    volumes:
      - opday_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # `restart: unless-stopped` alone only fires when the container actually
    # exits — Docker does NOT restart a container just because its own
    # healthcheck above reports "unhealthy" (e.g. the process is stuck but
    # still running). The `autoheal` service below watches this label and
    # force-restarts it in that case.
    labels:
      - autoheal=true

  # Restarts any container labeled autoheal=true the moment Docker marks it
  # unhealthy, by watching the socket — not just when it fully exits. Pairs
  # with the `app` healthcheck above, which otherwise has nothing acting on
  # it. See DEPLOYMENT.md's "If something goes down" section.
  autoheal:
    container_name: opday-ctf-autoheal
    image: willfarrell/autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # nickfedor/watchtower, not the archived containrrr/watchtower — that
  # one's Docker client is too old to talk to a modern daemon.
  watchtower:
    container_name: opday-ctf-watchtower
    image: nickfedor/watchtower
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup opday-ctf-app

  nginx:
    container_name: opday-ctf-nginx
    image: nginx:1.27-alpine
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: >
      sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    container_name: opday-ctf-certbot
    image: certbot/certbot
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  opday_data:
  certbot_conf:
  certbot_www:
